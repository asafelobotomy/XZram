name: Tag release

# When a push to main changes the version and no tag for it exists yet (the merge of a release PR),
# this creates the vX.Y.Z tag on that commit and a GitHub Release whose notes are the CHANGELOG
# section for that version (the AUR package build is then started on it). Tags and releases made with GITHUB_TOKEN start no other workflows,
# so anything that should follow is started explicitly. Pushing a tag by hand still works the same
# way. Anything that needs your own keys (the AUR) stays manual.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - VERSION

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      actions: write # start follow-up workflows
    steps:
      - name: Tag the new version and publish its release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          raw() { gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/$1?ref=$SHA"; }
          version=$(raw Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Cannot read a release version from Cargo.toml (got '$version')."
            exit 1
          fi
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          raw CHANGELOG.md | awk -v v="$version" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes under ## [$version]."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          echo "Tagged $SHA as $tag."
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "XZram $version" --notes-file notes.md "${prerelease[@]}"
          gh workflow run aur-release.yml --repo "$GITHUB_REPOSITORY" -f mode=release -f tag="$tag"
          echo "Released $tag." | tee -a "$GITHUB_STEP_SUMMARY"
