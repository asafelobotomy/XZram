name: AUR package

on:
  push:
    branches: [main, master]
    paths:
      - packaging/aur/**
      - scripts/ci-aur-package.sh
      - .github/workflows/aur-release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - gui/**
      - data/**
      - VERSION
  pull_request:
    paths:
      - packaging/aur/**
      - scripts/ci-aur-package.sh
      - .github/workflows/aur-release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - gui/**
      - data/**
      - VERSION
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: local
        type: choice
        options:
          - local
          - release
      tag:
        description: "Release tag for release mode (e.g. v0.3.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aur-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aur-build:
    name: Build AUR packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Read-only: this job runs makepkg, and so every crate build script. The release upload
    # that needs a write token is the separate attach-release job below.
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      tag: ${{ steps.meta.outputs.tag }}
      artifact: xzram-aur-${{ steps.meta.outputs.pkgver }}-${{ steps.meta.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep the token out of .git/config, which is mounted into the build container.
          persist-credentials: false

      - name: Resolve build mode
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            mode=release
            tag="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${DISPATCH_MODE:-local}"
            tag="${DISPATCH_TAG:-}"
          else
            mode=local
            tag=""
          fi
          if [[ "$mode" == "release" && -z "$tag" ]]; then
            echo "release mode requires a tag" >&2
            exit 1
          fi
          pkgver="$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD | head -1)"
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "pkgver=$pkgver" >>"$GITHUB_OUTPUT"
          echo "Building AUR mode=$mode tag=${tag:-none} pkgver=$pkgver"

      - name: Validate AUR PKGBUILD shape
        run: |
          set -euo pipefail
          grep -q "^pkgbase=xzram$" packaging/aur/PKGBUILD
          grep -q "pkgname=('xzram' 'xzram-gui')" packaging/aur/PKGBUILD
          grep -q 'cargo build --release --locked' packaging/aur/PKGBUILD
          grep -q 'archive/refs/tags/v$pkgver.tar.gz' packaging/aur/PKGBUILD
          if grep -E '^[[:space:]]*source=.*file://' packaging/aur/PKGBUILD; then
            echo "AUR PKGBUILD must not use file:// sources" >&2
            exit 1
          fi

      - name: Build packages in Arch container
        env:
          AUR_MODE: ${{ steps.meta.outputs.mode }}
          AUR_TAG: ${{ steps.meta.outputs.tag }}
          AUR_OUT: /out
        run: |
          set -euo pipefail
          mkdir -p "$PWD/aur-out"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/aur-out:/out" \
            -e AUR_MODE \
            -e AUR_TAG \
            -e AUR_OUT=/out \
            -e SRC_ROOT=/src \
            archlinux:latest \
            bash /src/scripts/ci-aur-package.sh

      - name: Upload AUR build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xzram-aur-${{ steps.meta.outputs.pkgver }}-${{ steps.meta.outputs.mode }}
          path: |
            aur-out/PKGBUILD
            aur-out/.SRCINFO
            aur-out/xzram.install
            aur-out/*.pkg.tar.zst
            aur-out/*.pkg.tar.xz
          if-no-files-found: error
          # .SRCINFO is a dotfile; upload-artifact skips those unless asked.
          include-hidden-files: true

  attach-release:
    name: Attach packages to GitHub Release
    needs: aur-build
    if: needs.aur-build.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token. It runs no repository code: no checkout, just
    # gh downloading this run's artifact and uploading it to the release.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download AUR build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ needs.aur-build.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir aur-out

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.aur-build.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(aur-out/*.pkg.tar.zst aur-out/*.pkg.tar.xz)
          # Prefer non-debug packages on the release page.
          upload=()
          for f in "${files[@]}"; do
            [[ "$f" == *-debug-* ]] && continue
            upload+=("$f")
          done
          upload+=(aur-out/PKGBUILD aur-out/xzram.install)
          if [[ -f aur-out/.SRCINFO ]]; then
            cp aur-out/.SRCINFO aur-out/SRCINFO
            upload+=(aur-out/SRCINFO)
          fi
          gh release upload "$TAG" "${upload[@]}" --clobber
