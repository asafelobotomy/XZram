name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable toolchain)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release
        run: cargo build --release --locked --verbose

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable toolchain)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: LOC limit (400)
        run: ./scripts/check-loc.sh

  distro-matrix:
    name: Distro smoke test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:42
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Smoke test in container
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/scripts/ci-distro-smoke.sh:/ci-distro-smoke.sh:ro" \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/xzram-target \
            -e RUSTUP_HOME=/tmp/rustup-home \
            "${{ matrix.image }}" \
            bash /ci-distro-smoke.sh "${{ matrix.distro }}"

  debian-package:
    name: Debian package smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Debian package
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/scripts/ci-debian-package.sh:/ci-debian-package.sh:ro" \
            -e CARGO_HOME=/tmp/cargo-home \
            -e RUSTUP_HOME=/tmp/rustup-home \
            debian:trixie \
            bash /ci-debian-package.sh

  qt-gui:
    name: Build Qt GUI (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Qt6 and build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev qt6-base-dev-tools
          cmake -S gui -B build-gui
          cmake --build build-gui
        env:
          QT_QPA_PLATFORM: offscreen

      - name: GUI smoke
        run: make gui-smoke
        env:
          QT_QPA_PLATFORM: offscreen

  uq:
    name: uQ Settings page
    runs-on: ubuntu-latest
    env:
      # The uQ release whose page rules and test kit this page is checked against. Move it
      # when uQ ships a newer one (and refresh tests/uq from templates/settings-page-tests).
      UQ_TAG: v0.3.0-rc.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the Qt 6 QML test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates

      - name: Page logic and manifest tests (Node)
        run: node --test tests/uq/*.test.mjs

      - name: Page tests (QML)
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq

      - name: Page install check (Makefile and both PKGBUILDs)
        run: ./scripts/check-uq-install.sh

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable toolchain)
        with:
          toolchain: stable

      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}

      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"

      # `--no-programs` skips only the "program exists" check: this page has no commands and
      # needs no installed xzram. Paths and everything else are still checked.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/

  arch-package:
    name: Verify PKGBUILD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate local PKGBUILD syntax
        run: |
          grep -q "pkgname=(" PKGBUILD
          grep -q '^pkgver=' PKGBUILD
          grep -q 'cargo build --release --locked' PKGBUILD
          grep -q 'file://\$startdir"' PKGBUILD
          ! grep -q 'file://\$startdir/\.\.' PKGBUILD

      - name: Validate AUR PKGBUILD shape
        run: |
          grep -q "^pkgbase=xzram$" packaging/aur/PKGBUILD
          grep -q "pkgname=('xzram' 'xzram-gui')" packaging/aur/PKGBUILD
          grep -q 'cargo build --release --locked' packaging/aur/PKGBUILD
          grep -q 'archive/refs/tags/v$pkgver.tar.gz' packaging/aur/PKGBUILD
          if grep -E '^[[:space:]]*source=.*file://' packaging/aur/PKGBUILD; then
            echo "AUR PKGBUILD must not use file:// sources" >&2
            exit 1
          fi
          test -f packaging/aur/.SRCINFO
          test -x scripts/ci-aur-package.sh

      - name: Check VERSION across packaging (incl. AUR .SRCINFO)
        run: make version-check
