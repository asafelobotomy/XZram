[workspace]
resolver = "2"
members = [
    "crates/xzram",
    "crates/xzram-cli",
    "crates/xzram-helper",
    "crates/xzramd",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/asafelobotomy/XZram"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
